name: Build TikTube APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Build Single Universal TikTube APK
        run: ./gradlew assembleStbetaRelease --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p output
          cp smarttubetv/build/outputs/apk/stbeta/release/*.apk output/TikTube.apk
          ls -lh output/

      - name: Upload Single Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTube-Universal
          path: output/TikTube.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "TikTube Universal (32-bit & 64-bit)"
          body: |
            ### 📺 TikTube - Single Universal Android TV App
            - **Universal Architecture:** Runs natively on both 32-bit (armeabi-v7a) and 64-bit (arm64-v8a) Android TV boxes.
            - **Direct Download:** Download `TikTube.apk` below and install directly without unzipping.
            - **Guaranteed Video Playback:** Uses SmartTube engine for live n-sig deciphering and PoToken attestation.
            - **TikTube Theme:** Red branding (`#E50914`) with custom TV squircle launcher banner.
          files: output/TikTube.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
